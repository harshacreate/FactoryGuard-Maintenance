[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="factoryguard-maintenance"
version="0.1.0"
description="Estimates a synthetic failure label from vibration, temperature, pressure, acoustic energy, load, wear, and ag"
requires-python=">=3.9"
dependencies=["numpy==2.0.2","scikit-learn==1.6.1"]
[project.optional-dependencies]
test=["pytest==8.4.2"]
[tool.pytest.ini_options]
testpaths=["tests"]
